<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preload" href="%PUBLIC_URL%/fonts/MonaspaceNeon/Monaspace%20Neon%20Var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/images/icons/file-folder.png" as="image" type="image/png">
  <link rel="preload" href="/images/icons/binder-sm.png" as="image" type="image/png">
  <link rel="stylesheet" href="%PUBLIC_URL%/fonts.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1" /> -->
  <!-- Browser UI color. The media attribute lets the browser pick and re-evaluate these
       itself on a system appearance change, so no JS is involved. Honored by Chrome and
       by Safari through 18; Safari 26+ ignores theme-color and derives its own tint. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)" />
  <title>biojameskim</title>
  <!-- description/OG/Twitter tags are rendered by <SEO> (react-helmet-async) per page,
       including a site-wide default in App.tsx, so they aren't duplicated here. -->
</head>

<body>
  <!-- Give Chakra the system theme before the app mounts to avoid a color flash. -->
  <script>
    (function () {
      try {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var mode = dark ? "dark" : "light";
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document.body.classList.add(dark ? "chakra-ui-dark" : "chakra-ui-light");
      } catch (e) { }
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

    -->
  <!-- MapMyVisitors Tracker: production domains only -->
  <script>
    if (
      window.location.hostname === "doctakim.com" ||
      window.location.hostname === "www.doctakim.com"
    ) {
      const tracker = new Image();
      tracker.src =
        "https://mapmyvisitors.com/map.png?d=SJ8-QkZBg-lWKZotTpDK6WsJYrqztHbhXIoC3mbGWWE&cl=ffffff";
      tracker.alt = "";
      tracker.hidden = true;
      document.body.appendChild(tracker);
    }
  </script>
</body>
