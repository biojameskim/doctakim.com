name: Update Spotify Music

on:
  schedule:
    # Weekly, Mondays at 12:00 UTC. GitHub cron is always UTC (no DST adjustment),
    # so this lands at 08:00 EDT in summer / 07:00 EST in winter.
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  update-music:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update music data
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run update-music

      - name: Commit and push if changed
        run: |
          if git status --porcelain src/data/top_songs_artists.ts | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/top_songs_artists.ts
            git commit -m "chore: update Spotify music data"
            git push origin HEAD:master
          else
            echo "No changes to commit."
          fi
